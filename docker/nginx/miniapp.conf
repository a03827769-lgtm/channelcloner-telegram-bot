# ============================================================
# ChannelCloner Pro — Nginx Reverse Proxy & Static Cache
# Handles Telegram WebApp SPA + PHP 8.3-FPM FastCGI
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.html index.php;

    # Security Headers for Telegram WebApp
    add_header X-Frame-Options "ALLOWALL" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml audio/mpeg;

    # Static Assets Caching
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Clean REST API URL Rewrites to PHP Endpoints
    location = /api/me {
        rewrite ^ /api/auth.php last;
    }

    location = /api/pairs {
        rewrite ^ /api/pairs.php last;
    }

    location = /api/story/settings {
        rewrite ^ /api/story.php?action=settings last;
    }

    location = /api/story/queue {
        rewrite ^ /api/story.php?action=queue last;
    }

    location = /api/audio-tracks {
        rewrite ^ /api/audio.php last;
    }

    location = /api/system {
        rewrite ^ /api/system.php last;
    }

    location = /api/billing {
        rewrite ^ /api/billing.php last;
    }

    # Direct FastCGI Routing for /api/*.php
    location ~ ^/api/(.+\.php)$ {
        root /var/www/html;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass miniapp_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/$1;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # SPA Routing for Frontend
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Block sensitive files
    location ~ /\.(env|git|sql|htaccess) {
        deny all;
        return 404;
    }
}
