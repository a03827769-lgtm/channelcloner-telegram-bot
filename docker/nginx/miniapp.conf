# ============================================================
# ChannelCloner Pro — Edge reverse proxy for the Telegram Mini App
#
# The Mini App (SPA + REST API) is served by the bot process itself
# (run.py, aiohttp) so that the Mini App and the cloning engine share one
# database. This nginx only terminates the Cloudflare tunnel traffic and
# forwards it to the bot's HTTP port on the Docker host.
# ============================================================

upstream cloner_bot {
    # Host-side bot HTTP server (PORT in .env, default 8080). host.docker.internal is provided by Docker
    # Desktop and by `extra_hosts: host-gateway` in docker-compose on Linux.
    server host.docker.internal:8080;
    keepalive 16;
}

# cloudflared forwards the visitor address in CF-Connecting-IP; local debugging requests have none
map $http_cf_connecting_ip $miniapp_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    autoindex off;

    # Telegram WebApps are rendered inside Telegram's own frames/webviews
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org https://t.me" always;

    # The API only accepts small JSON bodies; slow clients are cut off early
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Shared upstream settings (inherited by every location below)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $miniapp_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Block dotfiles and secrets outright
    location ~ /\. {
        deny all;
        return 404;
    }

    # Container healthcheck (docker-compose) — keep it out of the access log
    location = /health {
        proxy_pass http://cloner_bot;
        access_log off;
    }

    # Long-lived caching for content-hashed build assets. add_header here replaces the server-level
    # headers, so the security headers are repeated.
    location /assets/ {
        proxy_pass http://cloner_bot;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location / {
        proxy_pass http://cloner_bot;
    }
}
