# ============================================================
# ChannelCloner Pro — Container stack
#
# ONE BOT INSTANCE ONLY. A bot token / Telethon session may be used by exactly one process:
# either the host runtime (Windows watchdog -> python run.py) OR the `docker-bot` profile below,
# never both (two pollers -> TelegramConflictError, AUTH_KEY_DUPLICATED, duplicate posts).
# The Windows watchdog refuses to start the host bot while the container runs and stops the
# container when it appears next to a running host bot.
#
# Default services (`docker compose up -d`) — edge for the HOST bot on a Windows machine:
#   miniapp_web  – nginx edge proxy: forwards the Mini App (SPA + /api) to the bot process
#                  on the Docker host (host.docker.internal:8080)
#   cloudflared  – named Cloudflare tunnel (config in ./.cloudflared, see config.yml.example)
#
# Optional profile (never started implicitly):
#   docker-bot   – runs the bot itself in Docker INSTEAD of the host process (VPS / Linux).
#                  Start:  docker compose --profile docker-bot up -d --build telegram-cloner
#                  Stop:   docker compose --profile docker-bot stop telegram-cloner
#                  State (SQLite DB, vault key, logs, backups) lives in the named volume
#                  `channelcloner_bot_data` mounted at /app/data — never on a bind mount
#                  (SQLite WAL over a Windows/WSL bind mount is not safe). See DEPLOYMENT.md
#                  for moving an existing database into the volume.
# ============================================================

services:
  # ── Edge proxy for the Telegram Mini App ─────────────────────
  miniapp_web:
    image: nginx:stable-alpine
    container_name: channelcloner_miniapp_web
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    ports:
      # Local debugging only; public traffic arrives through cloudflared on the internal network
      - "127.0.0.1:${MINIAPP_WEB_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx/miniapp.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Liveness of the proxied host bot (/health). Readiness for load balancers is /ready.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloner_net

  # ── Cloudflare named tunnel ──────────────────────────────────
  cloudflared:
    # Pinned release; bump deliberately (https://github.com/cloudflare/cloudflared/releases)
    image: cloudflare/cloudflared:2026.9.1
    container_name: channelcloner_cloudflared
    restart: unless-stopped
    depends_on:
      miniapp_web:
        condition: service_started
    volumes:
      # config.yml + tunnel credentials JSON (both git-ignored); read-only for the container
      - ./.cloudflared:/etc/cloudflared:ro
    command: tunnel --no-autoupdate run
    networks:
      - cloner_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── OPTIONAL: the bot inside Docker (profile: docker-bot) ─────
  telegram-cloner:
    profiles: ["docker-bot"]
    container_name: telegram_channel_cloner
    image: channelcloner-telegram-cloner:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Playwright Chromium adds ~400 MB; only needed with ENABLE_PLAYWRIGHT=true
        INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-false}
    restart: unless-stopped
    mem_limit: 1536m
    mem_reservation: 384m
    cpus: 1.5
    env_file:
      - .env
    environment:
      # Container paths win over the host paths from .env: all persistent state is in /app/data
      DB_PATH: /app/data/cloner.db
      VAULT_KEY_PATH: /app/data/.vault_key
      TEMP_DOWNLOAD_DIR: temp_media
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
    ports:
      # Loopback only: a host reverse proxy (deploy/nginx/channelcloner.conf) publishes it via HTTPS
      - "127.0.0.1:${BOT_HTTP_PORT:-8080}:8080"
    volumes:
      - cloner_bot_data:/app/data
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - cloner_net

volumes:
  cloner_bot_data:
    name: channelcloner_bot_data

networks:
  cloner_net:
    name: channelcloner_net
