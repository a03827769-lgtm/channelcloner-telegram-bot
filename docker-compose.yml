# ============================================================
# ChannelCloner Pro — Production Multi-Container Stack
# PHP 8.3-FPM + MySQL 8.0 + Nginx + Python Telethon Worker
# Adheres to DOCKER_PRODUCTION_STANDARDS.md
# ============================================================

version: '3.8'

services:
  # ── 1. MySQL 8.0 Enterprise Relational Database ──────────────
  mysql:
    image: mysql:8.0
    container_name: channelcloner_mysql
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cloner_root_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-channelcloner}
      MYSQL_USER: ${MYSQL_USER:-cloner_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cloner_pass_2026}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - cloner_mysql_data:/var/lib/mysql
      - ./miniapp/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./miniapp/sql/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-cloner_root_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloner_net

  # ── 2. PHP 8.3-FPM Backend API ────────────────────────────
  miniapp_php:
    image: channelcloner_miniapp_php:latest
    build:
      context: .
      dockerfile: docker/miniapp/Dockerfile
    container_name: channelcloner_miniapp_php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-channelcloner}
      - MYSQL_USER=${MYSQL_USER:-cloner_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cloner_pass_2026}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - ./miniapp:/var/www/html
      - ./assets/audio:/app/assets/audio:ro
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloner_net

  # ── 3. Nginx Web Server & Static Cache ───────────────────
  miniapp_web:
    image: nginx:alpine
    container_name: channelcloner_miniapp_web
    restart: unless-stopped
    depends_on:
      - miniapp_php
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./miniapp:/var/www/html:ro
      - ./docker/nginx/miniapp.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - cloner_net

  # ── 4. Cloudflare 24/7 Global Edge Tunnel ────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: channelcloner_cloudflared
    restart: always
    depends_on:
      miniapp_web:
        condition: service_healthy
    volumes:
      - ./.cloudflared:/etc/cloudflared
    command: tunnel run
    networks:
      - cloner_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── 5. Python Telethon MTProto Cloner Daemon ───────────────
  telegram-cloner:
    container_name: telegram_channel_cloner
    image: channelcloner-telegram-cloner:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: always
    mem_limit: 1536m
    mem_reservation: 384m
    cpus: 1.5
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-channelcloner}
      - MYSQL_USER=${MYSQL_USER:-cloner_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cloner_pass_2026}
      - DB_PATH=/home/appuser/cloner.db
      - PYTHONUNBUFFERED=1
      - WEBAPP_URL=https://app.abdulloh.me
      - CLOUDFLARE_TUNNEL_DOMAIN=app.abdulloh.me
    volumes:
      - ./data:/app/data
      - ./temp_media:/app/temp_media
      - ./bot:/app/bot:ro
      - ./admin_bot:/app/admin_bot:ro
      - ./config:/app/config:ro
      - ./services:/app/services:ro
      - ./database:/app/database:ro
      - ./assets:/app/assets:ro
      - ./run.py:/app/run.py:ro
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - cloner_net

volumes:
  cloner_mysql_data:
    name: channelcloner_mysql_data

networks:
  cloner_net:
    name: channelcloner_net
