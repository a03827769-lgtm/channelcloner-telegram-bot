name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libjemalloc2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with Flake8 (Syntax & Undefined Names)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,temp_media,data

      - name: Run Unit Test Suite
        env:
          BOT_TOKEN: "123456789:TEST_BOT_TOKEN_FOR_CI_VALIDATION"
          ADMIN_BOT_TOKEN: "987654321:TEST_ADMIN_BOT_TOKEN_FOR_CI"
          TELEGRAM_API_ID: "123456"
          TELEGRAM_API_HASH: "test_telegram_api_hash_for_ci"
          ENCRYPTION_KEY: "test_master_encryption_key_ci_32_bytes!!"
          ENABLE_PLAYWRIGHT: "false"
        run: |
          python -m unittest discover tests
