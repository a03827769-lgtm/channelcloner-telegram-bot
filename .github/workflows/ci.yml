name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fake credentials: tests and the import smoke test must never reach Telegram
  BOT_TOKEN: "123456789:TEST_BOT_TOKEN_FOR_CI_VALIDATION"
  ADMIN_BOT_TOKEN: "987654321:TEST_ADMIN_BOT_TOKEN_FOR_CI"
  TELEGRAM_API_ID: "123456"
  TELEGRAM_API_HASH: "test_telegram_api_hash_for_ci"
  ENCRYPTION_KEY: "test_master_encryption_key_ci_32_bytes!!"
  ENABLE_PLAYWRIGHT: "false"
  CLONER_DISABLE_FILE_LOG: "1"

jobs:
  lint:
    name: Lint (syntax errors & undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install "ruff>=0.8,<0.9"
      - name: Ruff (E9, F63, F7, F82)
        run: ruff check --select E9,F63,F7,F82 --output-format=github --exclude webapp,temp_media,data,logs .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import smoke test (application entrypoint)
        run: |
          export DB_PATH="$RUNNER_TEMP/smoke/cloner.db"
          export VAULT_KEY_PATH="$RUNNER_TEMP/smoke/.vault_key"
          mkdir -p "$RUNNER_TEMP/smoke"
          python -c "import run"

      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider --timeout=120

  webapp:
    name: Mini App (TypeScript + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vite build

  docker:
    name: Docker image & compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml (all profiles)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile docker-bot config -q
      - name: Build image
        run: docker build -t channelcloner:ci .
