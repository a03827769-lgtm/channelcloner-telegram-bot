# ==============================================================================
# nginx site for the Telegram Channel Cloner Mini App on a VPS (template).
#
# Installed by deploy/oracle_master_setup.sh, which replaces __SERVER_NAME__ (your domain, or "_")
# and __BOT_PORT__ (8080). The site is HTTP only on purpose: `certbot --nginx -d <domain>` adds the
# HTTPS server (443) and the HTTP->HTTPS redirect once the certificate has been issued, so this file
# never references certificates that do not exist yet.
#
# The bot (docker compose --profile docker-bot) listens on 127.0.0.1:__BOT_PORT__ and serves the SPA,
# the /api routes, /health and /ready itself.
# ==============================================================================

limit_req_zone $binary_remote_addr zone=cloner_api_limit:10m rate=20r/s;

upstream cloner_bot {
    server 127.0.0.1:__BOT_PORT__ max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 1m;

    # Telegram WebApps are rendered inside Telegram's own frames/webviews
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org https://t.me" always;

    # Let's Encrypt HTTP-01 challenges (must win over the dotfile rule below)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Never expose dotfiles (.env, .git, ...) even if a misconfiguration serves files
    location ~ /\. {
        deny all;
    }

    # Optional GitHub webhook deployer (deploy/webhook, loopback only; see --with-webhook)
    location = /deploy-webhook {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=cloner_api_limit burst=40 nodelay;
        proxy_pass http://cloner_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
