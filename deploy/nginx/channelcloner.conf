# ==============================================================================
# Nginx Reverse Proxy Configuration for Telegram Channel Cloner & Mini App
# Primary Domain: abdulloh.me (and cloner.abdulloh.me / www.abdulloh.me)
# ==============================================================================

# Rate limiting zones for DDoS and brute-force mitigation
limit_req_zone $binary_remote_addr zone=cloner_api_limit:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=cloner_static_limit:10m rate=100r/s;

# Upstream Backends
upstream webapp_php_backend {
    server 127.0.0.1:8087 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream bot_health_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) - ACME Certbot & HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name abdulloh.me www.abdulloh.me cloner.abdulloh.me;

    # Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Cloudflare / Reverse proxy healthcheck pass-through if required
    location /health {
        proxy_pass http://bot_health_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect all other HTTP traffic to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) - Production Telegram Mini App & Bot Services
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abdulloh.me www.abdulloh.me cloner.abdulloh.me;

    # SSL Certificate Paths (Let's Encrypt / Custom SSL)
    ssl_certificate /etc/letsencrypt/live/abdulloh.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abdulloh.me/privkey.pem;

    # Modern TLS Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers for Telegram Mini App
    # Allows iframe embedding strictly inside Telegram WebApp clients
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare & Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    # Root Directory & Index
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Bot Keep-Alive Healthcheck Endpoint
    location = /health {
        limit_req zone=cloner_api_limit burst=30 nodelay;
        proxy_pass http://bot_health_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Static Assets Caching (Apple Liquid CSS, JS, Images, Fonts)
    location /assets/ {
        limit_req zone=cloner_static_limit burst=80 nodelay;
        proxy_pass http://webapp_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Telegram Mini App API Routes (JSON API)
    location = /api.php {
        limit_req zone=cloner_api_limit burst=50 nodelay;
        proxy_pass http://webapp_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Telegram Mini App Main Interface & Fallback
    location / {
        limit_req zone=cloner_api_limit burst=50 nodelay;
        proxy_pass http://webapp_php_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
